name: CI

# Tests, the stamped build and its checks on every push and pull request; on main, the Studio voice files go to the
# voice host and then the checked build is deployed to Cloudflare Workers (https://learnvedicmath.com/;
# openspec change learnvedicmath, design D12). Pull requests from branches of this repo also get a preview
# (preview.yml). The old GitHub Pages deploy of sbmadhav.com/vedic-math/ is gone from here: Phase B publishes the
# moved page once, with moved.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # pnpm workspaces (openspec change react-typescript, task 1.1): corepack runs the pnpm version package.json pins
      - name: Install the workspace
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # ESLint and stylelint (task 1.7): the same command the pre-commit hook runs
      - name: Lint
        run: pnpm lint

      # Vitest (task 1.6): the legacy tests in test/, the tools, the service worker, and the Worker in the Workers runtime
      - name: Unit tests
        run: pnpm test

      - name: Deploy credentials are named only by their own jobs
        run: node tools/check-workflow-secrets.mjs

      # Fails on stamps in the source, a policy <meta>, a header that differs from theme/header.html (compose.py),
      # a vendored file that does not match its SHA256SUMS, a /vedic-math/ or sbmadhav.com reference, an unlisted
      # third-party host, a _headers file Cloudflare would refuse, or more or bigger files than Cloudflare serves.
      # Until the owner sets up R2 (repository variable R2_ACCOUNT_ID, owner guide section 8b) the site is built with
      # --voice off: no published file names the voice host and read aloud uses the device voice (deploy-pipeline spec).
      - name: Build _site with cache stamps and headers
        env:
          VOICE: ${{ vars.R2_ACCOUNT_ID != '' && 'r2' || 'off' }}
        run: python3 build.py --out _site --voice "$VOICE"

      - name: Every page header is the composed theme/header.html
        run: python3 vendor/design-system/2.1.0/compose.py --check theme/header.html play/index.html $(find site -name '*.html')

      - name: The build is stamped, has its headers and no repo-only files
        run: |
          set -e
          err() { echo "::error::$1"; exit 1; }
          grep -q '<script type="importmap">' _site/play/index.html || err "_site/play/index.html has no import map"
          grep -Eq '"/js/app\.js": "/js/app\.js\?v=[0-9a-f]{10}"' _site/play/index.html || err "_site/play/index.html does not pin app.js in the import map"
          grep -Eq '<script type="module" src="/js/app\.js\?v=[0-9a-f]{10}"></script>' _site/play/index.html || err "_site/play/index.html loads app.js without a ?v= stamp"
          grep -Eq 'href="/math\.css\?v=[0-9a-f]{10}"' _site/play/index.html || err "_site/play/index.html loads math.css without a ?v= stamp"
          ! grep -rlq 'http-equiv="Content-Security-Policy"' _site --include='*.html' || err "a published page carries a policy <meta>; the policy belongs in _headers"
          grep -q '^/play/$' _site/_headers || err "_site/_headers has no rule for /play/"
          grep -q "Content-Security-Policy: default-src 'self'" _site/_headers || err "_site/_headers has no Content-Security-Policy"
          grep -Eq "^const VERSION = '[0-9a-f]{10}';" _site/sw.js || err "_site/sw.js VERSION is not a stamped hash"
          grep -q '"/play/", "' _site/sw.js || err "_site/sw.js does not precache the game shell"
          grep -q "^const VERSION: string = 'dev';" app/src/sw/sw.ts || err "app/src/sw/sw.ts in git must keep VERSION = 'dev'"
          for f in index.html _redirects robots.txt sitemap.xml .well-known/security.txt 404.html; do test -f "_site/$f" || err "_site/$f is missing"; done
          for f in AGENTS.md CODING_STANDARDS.md README.md GLOSSARY.md CONTRIBUTING.md SECURITY.md LICENSE LICENSE-CONTENT.md THIRD-PARTY-NOTICES.md build.py _config.yml wrangler.jsonc cloud test e2e docs tools site moved workers app shared deploy node_modules package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json vitest.config.ts eslint.config.js stylelint.config.js .npmrc .gitleaks.toml .github .githooks; do
            test ! -e "_site/$f" || err "_site/$f is a repo-only file and must not be published"
          done
          find _site -type f | sort

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      # wrangler reads wrangler.jsonc and _site the way the deploy will, without credentials and without deploying
      - name: Cloudflare accepts the configuration (dry run)
        working-directory: deploy
        run: |
          npm ci --ignore-scripts
          npx wrangler deploy --config ../wrangler.jsonc --dry-run --outdir ../.wrangler/dry-run

      # The exact files checked above are the ones deployed
      - name: Upload _site for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 3

  # cloud/firestore.rules against the Firestore emulator (cloud/test). Never touches production.
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # npm ci runs third-party install scripts; this job needs no git auth

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # @firebase/rules-unit-testing 6 needs Node 24.12 or newer
          cache: npm
          cache-dependency-path: cloud/test/package-lock.json

      - run: npm ci

      - name: Firestore rules tests
        run: npm test

  # Code and secret scanning without GitHub Advanced Security (design D12, task 18.6): CodeQL and push protection stop
  # when the repo goes private, so every push and pull request gets a Semgrep Community Edition result (the
  # JavaScript, Python and GitHub Actions rulesets) and a gitleaks scan of the whole history, public or private.
  # Not a required check and not needed by deploy. Two Semgrep rules are left out: they read every template string
  # handed to insertAdjacentHTML as unescaped HTML, while the Legacy views pass content through esc() and the React
  # views may not write HTML at all (ESLint, docs/agent/build-and-checks.md). The values gitleaks may skip, both public
  # by design, are named in .gitleaks.toml.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks reads every commit

      - name: Semgrep
        run: >-
          semgrep scan --metrics=off --error
          --config p/javascript --config p/python --config p/github-actions
          --exclude vendor --exclude '_*'
          --exclude-rule javascript.express.security.injection.raw-html-format.raw-html-format
          --exclude-rule typescript.react.security.audit.react-unsanitized-method.react-unsanitized-method

      # Runs even when Semgrep failed (a finding or a rules download), so every run has a secret scan result
      - name: gitleaks
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -e
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q -O "/tmp/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /tmp gitleaks
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          /tmp/gitleaks detect --no-banner --redact --verbose --source . --config .gitleaks.toml

  # Studio voice (design D17): on every push to main, copy any new files of the release named by js/voice-index.js to
  # the R2 bucket behind https://voice.learnvedicmath.com/ (checked against the archive's SHA-256 and their own hashed
  # names, never overwriting or deleting), then confirm every file the committed index names is there. The deploy
  # needs this job, so a site that names new voice files is never published before they exist. Runs only once the
  # owner has set up R2 (repository variable R2_ACCOUNT_ID, owner task 7.8); until then the site is built with
  # --voice off and deployed without it (see the deploy job).
  voice-upload:
    needs: [check, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.R2_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Upload new voice files and check the bucket
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: learnvedicmath-voice
        run: node tools/voice/r2-upload.mjs

  # Publishes the checked _site to Cloudflare Workers with wrangler (pinned in deploy/package.json). The token lives in
  # the production environment, whose deployment branches are main only (owner guide section 8), so no other branch
  # and no pull request can read it; it is passed only as an environment variable.
  deploy:
    needs: [check, rules, voice-upload]
    # Deploys only when every check and the Firestore rules tests succeeded, and the voice step either succeeded or was
    # skipped because R2 is not set up (deploy-pipeline spec). With R2_ACCOUNT_ID set, a failed or skipped voice step
    # deploys nothing, so the site never names voice files that are not on the voice host. With it empty, the check job
    # built _site with --voice off, which names no voice host, and the first step below confirms that. always() lets
    # this job run when voice-upload was skipped; the explicit results keep a failed or cancelled job blocking.
    if: >-
      always()
      && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
      && needs.check.result == 'success' && needs.rules.result == 'success'
      && (needs.voice-upload.result == 'success' || (needs.voice-upload.result == 'skipped' && vars.R2_ACCOUNT_ID == ''))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://learnvedicmath.com/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - name: Without R2, the site names no voice host
        if: vars.R2_ACCOUNT_ID == ''
        run: |
          if grep -rli 'voice\.learnvedicmath\.com' _site; then
            echo "::error::R2 is not set up, but the files above name the voice host; the site must be built with --voice off"
            exit 1
          fi
          echo "R2 is not set up: deploying without the Studio voice; read aloud uses the device voice"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Deploy to Cloudflare Workers
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A token pasted with pbpaste can carry a trailing newline or spaces, which Cloudflare rejects as an invalid
          # Authorization header. Strip whitespace at both ends, then refuse anything that is not a token's shape (never printed).
          t="$CLOUDFLARE_API_TOKEN"; t="${t#"${t%%[![:space:]]*}"}"; t="${t%"${t##*[![:space:]]}"}"  # leading and trailing only
          CLOUDFLARE_API_TOKEN="$t"; export CLOUDFLARE_API_TOKEN
          if [[ ! "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]{20,}$ ]]; then
            echo "::error::The Cloudflare token secret is not a token (${#CLOUDFLARE_API_TOKEN} characters after trimming); save it again with gh secret set"
            exit 1
          fi
          npm ci --ignore-scripts
          npx wrangler deploy --config ../wrangler.jsonc
