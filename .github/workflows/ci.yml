name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Stamp the import map
        run: python3 build.py

      - name: Stamped files are committed
        run: |
          git diff --exit-code || {
            echo "::error::build.py changed the files above. Run python3 build.py and commit the result."
            exit 1
          }

      - name: Unit tests
        run: node --test 'test/**/*.test.{js,mjs}'
