name: E2E (live site)

# Playwright end-to-end tests against the LIVE https://learnvedicmath.com/ (openspec change learnvedicmath, design
# D12): after each deploy (once the live files match this commit's build), daily, and on demand with any base URL
# (a preview, or a local tunnel), or with perf_only the perf check alone. Production Firestore is never written to:
# the suite aborts and fails on any write-shaped request (e2e/tests/fixtures.ts). No pull_request trigger here: pull
# requests run the suite against their own preview (preview.yml). One secret, the preview token, named only by the
# reference job (environment preview), which uploads the pinned perf reference build (tools/check-workflow-secrets.mjs).
#
# The move from sbmadhav.com (design D13) is watched by the daily run too, by the repository variable MOVE_PHASE:
#   B: the moved page at https://sbmadhav.com/vedic-math/ (tests/moved.live.spec.ts);
#   C: https://sbmadhav.com/vedic-math/x?y=1 answers 301 to learnvedicmath.com/x?y=1.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (default https://learnvedicmath.com)'
        required: false
        default: ''
      perf_only:
        description: 'Only the perf check: production against the pinned reference build, as after a deploy (no issue)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]

permissions:
  contents: read

# Pushes share one group; every daily or on-demand run (the full suite, with the scenario specs and the video check)
# has a group of its own, so neither a merge nor another manual run (perhaps for another base_url) cancels or
# replaces it. A newer push to main still cancels the run for an older push: both test what is live, and the older
# run would test a site that changes under it. With the suite in shards a push run takes about 15 to 20 minutes, so
# only pushes that land closer together than that cancel one another.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # On a push, CI deploys the stamped build. Wait once, here, until the live game shell, worker and entry module match
  # this commit's build (the shell pins every module hash, sw.js carries the cache VERSION); the shards start after.
  # The daily and on-demand runs test what is live and pass straight through. It also names the Playwright version
  # e2e/package.json pins, for the shards' container image.
  deploy:
    name: Wait for the deploy
    # Nothing is live on learnvedicmath.com until the owner's Cloudflare setup (repository variable CLOUDFLARE_ACCOUNT_ID)
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' || inputs.base_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The Playwright version e2e/package.json pins
        id: pw
        run: |
          v=$(node -p "require('./e2e/package.json').devDependencies['@playwright/test']")
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::@playwright/test is not pinned to an exact version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Node before the deploy wait: build.py turns app/src/sw/sw.ts into sw.js with Node's type stripper (22.13+)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'push'
        with:
          node-version: '22'

      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: |
          python3 "$GITHUB_WORKSPACE/build.py" --out "$GITHUB_WORKSPACE/_site" >/dev/null
          for i in $(seq 1 45); do
            ok=1
            for f in play/index.html sw.js js/app.js; do
              want=$(sha256sum "$GITHUB_WORKSPACE/_site/$f" | cut -d' ' -f1)
              path=${f%index.html}
              got=$(curl -fsSL "https://learnvedicmath.com/$path?deploy-check=${GITHUB_SHA}-${i}" | sha256sum | cut -d' ' -f1) || got=none
              [ "$got" = "$want" ] || { ok=0; echo "Try $i: live /$path is not this commit yet."; }
            done
            if [ $ok = 1 ]; then echo "Live learnvedicmath.com matches this commit (try $i)."; exit 0; fi
            sleep 20
          done
          echo "::warning::The live site still differs from this commit after about 15 minutes. Testing what is live."

  # The suite in six shards on six runners (Playwright --shard). In one job it took 28 to 29 minutes after a push and
  # 43 to 46 minutes daily (with the scenario specs), past the old 50-minute limit once setup and the deploy wait were
  # added. Each shard runs every project (chromium, webkit, mobile) on its sixth of the tests; shards are not equal in
  # time (four shards took 5.6 to 18.6 minutes daily), so six keep the longest well inside the limit.
  # They run in Playwright's own image, with the browsers and their system libraries already installed: installing
  # them with apt on each runner (--with-deps) took 40 seconds to over 30 minutes from the Azure Ubuntu mirror, and a
  # shard ran out of time there.
  e2e:
    name: e2e (shard ${{ matrix.shard }} of 6)
    needs: deploy
    if: ${{ !inputs.perf_only }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.deploy.outputs.playwright }}-noble
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: e2e
    env:
      BASE_URL: ${{ inputs.base_url || 'https://learnvedicmath.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # pnpm workspaces (openspec change react-typescript, task 1.1): corepack runs the pnpm version package.json pins
      - name: Install the e2e package
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e

      # The one font a spec names that the image lacks and ubuntu-latest has: Math Lens's fake camera draws its digits in
      # DejaVu Sans Mono (tests/play-lens.spec.ts), and the image's fallback monospace read as 4791 or 47271
      - name: DejaVu fonts, as on ubuntu-latest
        working-directory: .
        run: |
          for i in 1 2 3; do
            timeout 300 sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-dejavu-core' && exit 0
            echo "Try $i to install fonts-dejavu-core failed."
          done
          exit 1

      # The daily run and a manual run also run the scenario coverage specs in tests/cov (chromium only, see
      # playwright.config.ts); the run after a push leaves them out. The Watch shelf video check (@live-videos) and
      # the background's frame cost (@frame-cost) run in their own jobs below. Each shard writes a blob report; the report job merges them into one HTML report.
      - name: Playwright tests (shard ${{ matrix.shard }} of 6)
        env:
          E2E_SKIP_COV: ${{ github.event_name == 'push' && '1' || '' }}
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/6 --reporter=list,github,blob --grep-invert "@live-videos|@frame-cost"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 2

  # The background's frame cost (tests/background-perf.spec.ts, @frame-cost) is measured with nothing else running:
  # with three workers on a four-core runner the other browsers preempt the timed frame, and its p95 read 3.6 to
  # 6.6 ms for a drawing that costs about 1 ms there (docs/agent/e2e.md). A runner of its own, beside the shards, in
  # the same image (installing chromium's libraries with apt took 2 to 12 minutes here).
  frame-cost:
    name: Frame cost of the background, alone on the runner (chromium)
    needs: deploy
    if: ${{ !inputs.perf_only }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.deploy.outputs.playwright }}-noble
      options: --ipc=host
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    env:
      BASE_URL: ${{ inputs.base_url || 'https://learnvedicmath.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install the e2e package
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e

      - name: Frame cost (@frame-cost, one worker)
        run: pnpm exec playwright test --project=chromium --grep @frame-cost --workers=1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-frame-cost
          path: e2e/playwright-report
          retention-days: 14

  # The daily and on-demand runs check every Watch shelf video on YouTube (tests/videos.live.spec.ts, @live-videos,
  # chromium only) on a runner of its own with 4 workers (openspec watch-shelf, design decision 6). Inside a shard it
  # shared three workers with every other project's specs, and one embed that loaded late under that load failed
  # the 10 s wait (run 40503901180) although the video played. The push run leaves it out.
  videos:
    name: Every Watch shelf video still plays (chromium)
    needs: deploy
    if: ${{ github.event_name != 'push' && !inputs.perf_only }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.deploy.outputs.playwright }}-noble
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    env:
      BASE_URL: ${{ inputs.base_url || 'https://learnvedicmath.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install the e2e package
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e

      - name: Watch shelf videos (@live-videos, 4 workers)
        run: pnpm exec playwright test --project=chromium --grep @live-videos --workers=4

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-videos
          path: e2e/playwright-report
          retention-days: 14

  # One HTML report for the run, merged from the shards' blob reports, kept when a shard failed (as the single job's
  # report was)
  report:
    name: Merge the shards' reports
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install the e2e package
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The pinned reference build for the perf check after a deploy (openspec change perf-gate-same-runner-post-deploy,
  # design D1 to D3): reference.commit of docs/perf/baseline.json, one fixed commit of main moved only with a reason,
  # built as previews are (--preview, production's voice mode) and uploaded as a Worker version with the preview alias
  # perf-ref on workers.dev, from that commit's own deploy/ and wrangler.jsonc. Uploaded on every run, so it is always
  # the pinned code and there is no state to look after. A job of its own, beside the deploy wait and the shards: the
  # preview token (environment preview) stays in this job, which only builds and uploads, and never reaches the job that
  # runs Lighthouse against the live site; and when this job fails (an upload error, or GitHub refusing the environment
  # to this branch), continue-on-error keeps the run green and the perf job compares production with the baseline
  # alone, saying so under its table. A version upload never changes what learnvedicmath.com serves.
  reference:
    name: Upload the pinned perf reference
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name == 'push' || inputs.perf_only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      url: ${{ steps.upload.outputs.url }}
      commit: ${{ steps.pin.outputs.commit }}
      status: ${{ steps.done.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned commit (docs/perf/baseline.json, reference.commit)
        id: pin
        run: |
          c=$(jq -r '.reference.commit // empty' docs/perf/baseline.json)
          [[ "$c" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::docs/perf/baseline.json has no reference.commit (a full commit id): '$c'"; exit 1; }
          echo "commit=$c" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pin.outputs.commit }}
          path: _reference
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _reference/deploy/package-lock.json

      - name: Build the reference
        working-directory: _reference
        # Same voice mode as production (ci.yml) and the previews (preview.yml)
        env:
          VOICE: ${{ vars.R2_ACCOUNT_ID != '' && 'r2' || 'off' }}
        run: python3 build.py --preview --out _site --voice "$VOICE"

      - name: Upload the reference version (alias perf-ref)
        id: upload
        working-directory: _reference/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: perf-ref
        run: |
          # As preview.yml: strip whitespace at both ends, then refuse anything that is not a token's shape (never printed)
          t="$CLOUDFLARE_API_TOKEN"; t="${t#"${t%%[![:space:]]*}"}"; t="${t%"${t##*[![:space:]]}"}"  # leading and trailing only
          CLOUDFLARE_API_TOKEN="$t"; export CLOUDFLARE_API_TOKEN
          if [[ ! "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]{20,}$ ]]; then
            echo "::error::The preview token secret is not a token (${#CLOUDFLARE_API_TOKEN} characters after trimming); save it again with gh secret set"
            exit 1
          fi
          npm ci --ignore-scripts
          set +e
          npx wrangler versions upload --config ../wrangler.jsonc --preview-alias "$ALIAS" 2>&1 | tee upload.log
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" = 0 ] || exit "$code"
          url=$(grep -Eo "https://${ALIAS}-learnvedicmath\.[a-z0-9-]+\.workers\.dev" upload.log | head -1)
          test -n "$url" || { echo "::error::no reference URL in the wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The alias serves the pinned build: its sw.js (which carries the build's cache VERSION) is the one built here.
      # A new version can take a few seconds to answer on the alias.
      - name: The reference answers with the pinned build
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          want=$(sha256sum _reference/_site/sw.js | cut -d' ' -f1)
          for i in $(seq 1 12); do
            got=$(curl -fsSL "$URL/sw.js?ref-check=${GITHUB_RUN_ID}-${i}" | sha256sum | cut -d' ' -f1) || got=none
            if [ "$got" = "$want" ]; then echo "$URL serves the pinned build (try $i)."; exit 0; fi
            sleep 10
          done
          echo "::error::$URL does not serve the pinned build's sw.js"
          exit 1

      # continue-on-error makes needs.reference.result read success even when a step failed, so the job's own status
      # goes out as an output for the perf job's note (#179 review)
      - name: The job's status
        id: done
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: echo "status=$STATUS" >> "$GITHUB_OUTPUT"

  # The load and interaction checks on production after each deploy (openspec change react-typescript,
  # performance-budget spec, task 1.8; openspec change perf-gate-same-runner-post-deploy): the same measurements and
  # rules as the preview's perf job, with production as the measured side and the pinned reference build (the reference
  # job above) as the reference, both measured in this job page by page on one runner, so the runner's CPU speed, which
  # moves blocking time about two to one between GitHub's runners, cancels (docs/perf/baseline.md, "The post-deploy
  # reference"). tools/perf-compare.ts counts blocking time, layout shift and the interactions from the reference's
  # median of this job; largest contentful paint stays on the baseline (the reference is on workers.dev, a different
  # network chain from the custom domain), first contentful paint is reported, and the baseline is shown for
  # information. Without a reference URL (the upload failed or was refused) production is compared with the baseline
  # alone, as before, and the notes under the table say so. A miss is measured once more, only the kind that missed,
  # and a second miss comments on the open issue or opens one; the deploy stays. A run by hand with perf_only measures
  # the same way and shows the table, without an issue.
  perf:
    needs: [deploy, e2e, reference]
    # After the shards and the upload whatever their result, but only when the deploy job ran to the end
    if: always() && needs.deploy.result == 'success' && vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name == 'push' || inputs.perf_only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    env:
      BASE_URL: https://learnvedicmath.com
      REFERENCE_URL: ${{ needs.reference.outputs.url }}
      REFERENCE_COMMIT: ${{ needs.reference.outputs.commit }}
      REFERENCE_RESULT: ${{ needs.reference.outputs.status || needs.reference.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install the e2e package and chromium
        working-directory: e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e
          pnpm exec playwright install --with-deps chromium

      - name: The pinned reference, or why it is missing
        run: |
          if [ -n "$REFERENCE_URL" ]; then echo "Reference: $REFERENCE_URL (commit $REFERENCE_COMMIT)"
          else echo "::warning::The pinned perf reference was not uploaded (upload job: $REFERENCE_RESULT): production is compared with the baseline alone, as before"; fi

      - name: Lighthouse (mobile preset, 5 runs a page), production and the reference page by page
        working-directory: e2e
        run: |
          if [ -n "$REFERENCE_URL" ]; then
            node perf/lighthouse.mts "$BASE_URL" --json perf/results/lighthouse.json --reference "$REFERENCE_URL" --reference-json perf/results/reference/lighthouse.json
          else
            node perf/lighthouse.mts "$BASE_URL" --json perf/results/lighthouse.json
          fi

      - name: Interaction timings (4x CPU, 5 runs), the reference then production
        working-directory: e2e
        run: |
          if [ -n "$REFERENCE_URL" ]; then
            mkdir -p perf/results/reference
            BASE_URL="$REFERENCE_URL" pnpm exec playwright test -c perf/playwright.config.ts
            cp perf/results/interactions.json perf/results/reference/interactions.json
          fi
          pnpm exec playwright test -c perf/playwright.config.ts

      # As on a pull request: a runner's load can still move a Lighthouse median past a tolerance within a job, so a miss
      # is measured once more, only the kind that missed (the Lighthouse pages or the interactions, on both hosts), and
      # only a miss in both runs comments on the issue. The first run's results stay in the artifact under results/first.
      - name: Compare with the pinned reference and the baseline; open an issue on a miss
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          short=${REFERENCE_COMMIT::7}
          why="the upload job ended with ${REFERENCE_RESULT:-no result} and gave no URL (see its log; if GitHub refused the job its preview environment, that environment's deployment branches need main, an owner setting)"
          compare() {
            if [ -n "$REFERENCE_URL" ]; then
              node tools/perf-compare.ts docs/perf/baseline.json e2e/perf/results/lighthouse.json e2e/perf/results/interactions.json \
                --reference e2e/perf/results/reference/lighthouse.json e2e/perf/results/reference/interactions.json \
                --reference-label "Reference (\`$short\`)" --label Production --out perf-table.md
            else
              node tools/perf-compare.ts docs/perf/baseline.json e2e/perf/results/lighthouse.json e2e/perf/results/interactions.json \
                --label Production --reference-missing "$why" --out perf-table.md
            fi
          }
          compare; code=$?
          incomplete=0
          if [ "$code" != 0 ]; then
            echo "::warning::a median missed its tolerance; measuring again to confirm"
            mkdir -p e2e/perf/results/first
            cp perf-table.md perf-table-first.md
            cp e2e/perf/results/*.json e2e/perf/results/first/
            if [ -n "$REFERENCE_URL" ]; then mkdir -p e2e/perf/results/first/reference && cp e2e/perf/results/reference/*.json e2e/perf/results/first/reference/; fi
            cd e2e
            # An over row of a Lighthouse metric (any but inp and visible) re-measures the pages; an over interaction row the
            # interactions. A re-measure that fails on either host leaves the first run's table and opens no issue: the
            # second comparison would mix the first run's numbers with the second's (#179 review)
            if grep '\*\*over\*\*' ../perf-table.md | grep -qvE '\| (inp|visible) \|'; then
              if [ -n "$REFERENCE_URL" ]; then
                node perf/lighthouse.mts "$BASE_URL" --json perf/results/lighthouse.json --reference "$REFERENCE_URL" --reference-json perf/results/reference/lighthouse.json || incomplete=1
              else
                node perf/lighthouse.mts "$BASE_URL" --json perf/results/lighthouse.json || incomplete=1
              fi
            fi
            if grep '\*\*over\*\*' ../perf-table.md | grep -qE '\| (inp|visible) \|'; then
              if [ -n "$REFERENCE_URL" ]; then
                if BASE_URL="$REFERENCE_URL" pnpm exec playwright test -c perf/playwright.config.ts; then
                  cp perf/results/interactions.json perf/results/reference/interactions.json
                else incomplete=1; fi
              fi
              pnpm exec playwright test -c perf/playwright.config.ts || incomplete=1
            fi
            cd ..
            if [ "$incomplete" = 0 ]; then compare; code=$?
            else
              cp perf-table-first.md perf-table.md
              echo "::warning::the re-measure did not finish on both hosts; the table is the first run's, and no issue is opened"
            fi
          fi
          set -e
          cat perf-table.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ] && [ "$incomplete" = 0 ]; then
            if [ "$EVENT" != push ]; then echo "::warning::a median missed its tolerance twice (see the table); a run by hand opens no issue"; exit 0; fi
            if [ -n "$REFERENCE_URL" ]; then
              what=$(printf 'misses its tolerance against the pinned reference build (`%s`, docs/perf/baseline.json `reference`), both measured in this job page by page on one runner, with the baseline for information' "$short")
            else
              what='misses the performance baseline (docs/perf/baseline.json); the pinned reference was not measured (see the notes under the table)'
            fi
            body=$(printf 'Production (%s, after the deploy of %s) %s. The deploy stays.\n\n%s\n\nRun: %s/%s/actions/runs/%s' "$BASE_URL" "$GITHUB_SHA" "$what" "$(cat perf-table.md)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            # One open issue while a miss lasts: later misses comment on it
            title="Performance budget missed on production"
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title | startswith(\"$title\"))][0].number // empty")
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title (${GITHUB_SHA::7})" --body "$body"; fi
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-production
          path: e2e/perf/results
          retention-days: 30

  # Phase B (design D13): the moved page at https://sbmadhav.com/vedic-math/ hands progress over (task 16.4)
  moved-page:
    if: vars.MOVE_PHASE == 'B' && github.event_name != 'push' && !inputs.perf_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e
      - run: pnpm exec playwright install --with-deps chromium
      - name: The moved page on sbmadhav.com
        env:
          MOVED_URL: https://sbmadhav.com/vedic-math/
        run: pnpm exec playwright test --project=chromium tests/moved.live.spec.ts

  # Phase C (design D13, task 18.5): GitHub's custom-domain redirect sends every old URL to learnvedicmath.com with a
  # 301. Undocumented GitHub behaviour, so it is checked every day.
  redirect-301:
    if: vars.MOVE_PHASE == 'C' && github.event_name != 'push' && !inputs.perf_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sbmadhav.com/vedic-math/ answers 301 to learnvedicmath.com
        run: |
          set -e
          for u in "https://sbmadhav.com/vedic-math/x?y=1" "https://sbmadhav.github.io/vedic-math/x?y=1"; do
            head=$(curl -sI "$u")
            echo "$head" | head -1 | grep -q ' 301' || { echo "::error::$u does not answer 301"; echo "$head"; exit 1; }
            printf '%s\n' "$head" | tr -d '\r' | grep -iExq 'location: https://learnvedicmath\.com/x\?y=1' || { echo "::error::$u does not redirect to learnvedicmath.com/x?y=1"; echo "$head"; exit 1; }
          done
