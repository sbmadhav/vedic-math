name: E2E (live site)

# Playwright end-to-end tests against the LIVE https://learnvedicmath.com/ (openspec change learnvedicmath, design
# D12): after each deploy (once the live files match this commit's build), daily, and on demand with any base URL
# (a preview, or a local tunnel). Production Firestore is never written to: the suite aborts and fails on any
# write-shaped request (e2e/tests/fixtures.ts). No pull_request trigger here: pull requests run the suite against their
# own preview (preview.yml). No secrets.
#
# The move from sbmadhav.com (design D13) is watched by the daily run too, by the repository variable MOVE_PHASE:
#   B: the moved page at https://sbmadhav.com/vedic-math/ (tests/moved.live.spec.ts);
#   C: https://sbmadhav.com/vedic-math/x?y=1 answers 301 to learnvedicmath.com/x?y=1.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (default https://learnvedicmath.com)'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the run for an older push, but never the daily or on-demand run (the full suite, with the
# scenario specs and the video check): one group per event, so a merge during a full run no longer cancels it
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    # Nothing is live on learnvedicmath.com until the owner's Cloudflare setup (repository variable CLOUDFLARE_ACCOUNT_ID)
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' || inputs.base_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: e2e
    env:
      BASE_URL: ${{ inputs.base_url || 'https://learnvedicmath.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node before the deploy wait: build.py turns app/src/sw/sw.ts into sw.js with Node's type stripper (22.13+)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # On a push, CI deploys the stamped build. Wait until the live game shell, worker and entry module match this
      # commit's build (the shell pins every module hash, sw.js carries the cache VERSION).
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: |
          python3 "$GITHUB_WORKSPACE/build.py" --out "$GITHUB_WORKSPACE/_site" >/dev/null
          for i in $(seq 1 45); do
            ok=1
            for f in play/index.html sw.js js/app.js; do
              want=$(sha256sum "$GITHUB_WORKSPACE/_site/$f" | cut -d' ' -f1)
              path=${f%index.html}
              got=$(curl -fsSL "https://learnvedicmath.com/$path?deploy-check=${GITHUB_SHA}-${i}" | sha256sum | cut -d' ' -f1) || got=none
              [ "$got" = "$want" ] || { ok=0; echo "Try $i: live /$path is not this commit yet."; }
            done
            if [ $ok = 1 ]; then echo "Live learnvedicmath.com matches this commit (try $i)."; exit 0; fi
            sleep 20
          done
          echo "::warning::The live site still differs from this commit after about 15 minutes. Testing what is live."

      # pnpm workspaces (openspec change react-typescript, task 1.1): corepack runs the pnpm version package.json pins
      - name: Install the e2e package
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e

      - run: pnpm exec playwright install --with-deps chromium webkit

      # The daily run and a manual run also check every Watch shelf video on YouTube (tests/videos.live.spec.ts,
      # tagged @live-videos, chromium only) and run the scenario coverage specs in tests/cov (chromium only, see
      # playwright.config.ts); the run after a push leaves both out. The background's frame cost (@frame-cost) runs
      # on its own below.
      - name: Playwright tests
        id: suite
        env:
          E2E_SKIP_COV: ${{ github.event_name == 'push' && '1' || '' }}
        run: pnpm exec playwright test --grep-invert "${{ github.event_name == 'push' && '@live-videos|@frame-cost' || '@frame-cost' }}"

      # The background's frame cost (tests/background-perf.spec.ts, @frame-cost) is measured with nothing else running:
      # with three workers on a four-core runner the other browsers preempt the timed frame, and its p95 read 3.6 to
      # 6.6 ms for a drawing that costs about 1 ms there (docs/agent/e2e.md). Its own output folders keep the suite's
      # traces and report in the artifact. Runs whenever the suite ran, passed or not.
      - name: Frame cost of the background, alone on the runner (chromium)
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/frame-cost
        run: pnpm exec playwright test --project=chromium --grep @frame-cost --workers=1 --output test-results/frame-cost

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The load and interaction checks on production after each deploy (openspec change react-typescript,
  # performance-budget spec, task 1.8): the same measurements as the preview's perf job, against
  # https://learnvedicmath.com once the e2e job has seen the deploy go live. A miss opens an issue with the numbers;
  # the deploy stays.
  perf:
    needs: e2e
    if: always() && github.event_name == 'push' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    env:
      BASE_URL: https://learnvedicmath.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install the e2e package and chromium
        working-directory: e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e
          pnpm exec playwright install --with-deps chromium

      - name: Lighthouse (mobile preset, 5 runs a page)
        working-directory: e2e
        run: node perf/lighthouse.mts "$BASE_URL" --json perf/results/lighthouse.json

      - name: Interaction timings (4x CPU, 5 runs)
        working-directory: e2e
        run: pnpm exec playwright test -c perf/playwright.config.ts

      - name: Compare with the baseline; open an issue on a miss
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node tools/perf-compare.ts docs/perf/baseline.json e2e/perf/results/lighthouse.json e2e/perf/results/interactions.json --out perf-table.md
          code=$?
          # One more run before an issue: a runner's load alone can move a Lighthouse median past the tolerance
          if [ "$code" != 0 ]; then
            (cd e2e && node perf/lighthouse.mts "$BASE_URL" --json perf/results/lighthouse.json && pnpm exec playwright test -c perf/playwright.config.ts)
            node tools/perf-compare.ts docs/perf/baseline.json e2e/perf/results/lighthouse.json e2e/perf/results/interactions.json --out perf-table.md
            code=$?
          fi
          set -e
          cat perf-table.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            body=$(printf 'Production (%s, after the deploy of %s) misses the performance baseline (docs/perf/baseline.json). The deploy stays.\n\n%s\n\nRun: %s/%s/actions/runs/%s' "$BASE_URL" "$GITHUB_SHA" "$(cat perf-table.md)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            # One open issue while a miss lasts: later misses comment on it
            title="Performance budget missed on production"
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title | startswith(\"$title\"))][0].number // empty")
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title (${GITHUB_SHA::7})" --body "$body"; fi
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-production
          path: e2e/perf/results
          retention-days: 30

  # Phase B (design D13): the moved page at https://sbmadhav.com/vedic-math/ hands progress over (task 16.4)
  moved-page:
    if: vars.MOVE_PHASE == 'B' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e
      - run: pnpm exec playwright install --with-deps chromium
      - name: The moved page on sbmadhav.com
        env:
          MOVED_URL: https://sbmadhav.com/vedic-math/
        run: pnpm exec playwright test --project=chromium tests/moved.live.spec.ts

  # Phase C (design D13, task 18.5): GitHub's custom-domain redirect sends every old URL to learnvedicmath.com with a
  # 301. Undocumented GitHub behaviour, so it is checked every day.
  redirect-301:
    if: vars.MOVE_PHASE == 'C' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sbmadhav.com/vedic-math/ answers 301 to learnvedicmath.com
        run: |
          set -e
          for u in "https://sbmadhav.com/vedic-math/x?y=1" "https://sbmadhav.github.io/vedic-math/x?y=1"; do
            head=$(curl -sI "$u")
            echo "$head" | head -1 | grep -q ' 301' || { echo "::error::$u does not answer 301"; echo "$head"; exit 1; }
            printf '%s\n' "$head" | tr -d '\r' | grep -iExq 'location: https://learnvedicmath\.com/x\?y=1' || { echo "::error::$u does not redirect to learnvedicmath.com/x?y=1"; echo "$head"; exit 1; }
          done
