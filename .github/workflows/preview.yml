name: Preview

# A preview of every pull request from a branch of this repo (openspec change learnvedicmath, design D12): the build
# with --preview (X-Robots-Tag: noindex, nofollow on every response), uploaded as a Worker version with the alias
# pr-<number> on workers.dev, its URL posted on the pull request, and the Playwright suite run against it (chromium).
# Only the pull_request event, never pull_request_target: GitHub gives no secrets to runs for forks, and a fork's pull
# request is skipped below anyway. The preview token (CLOUDFLARE_PREVIEW_TOKEN) is in the preview environment and is
# separate from the production token, so revoking either never touches the other. Previews never post anything: the
# suite uses the fake Firebase SDK, and the Firebase key's referrers do not include workers.dev.
# The job skips its steps until the preview token is saved and build.py has --preview (secrets cannot be read in a
# job-level if). A version can only be uploaded once the Worker exists: the first production deploy from main (owner
# task 1.7, then 11.1) creates it, so previews start working after that deploy.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is a preview possible?
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
        run: |
          # The preview token is saved, and this branch's build.py knows --preview (it comes with the move itself)
          if [ -z "$TOKEN" ]; then echo "::notice::CLOUDFLARE_PREVIEW_TOKEN is not saved in the preview environment yet; no preview"
          elif ! grep -q -- "--preview" build.py; then echo "::notice::this branch's build.py has no --preview yet; no preview"
          else echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Build the preview
        if: steps.token.outputs.present == 'true'
        # Same voice mode as production (ci.yml): with R2 not set up there is no voice host, so read aloud uses the device voice
        env:
          VOICE: ${{ vars.R2_ACCOUNT_ID != '' && 'r2' || 'off' }}
        run: python3 build.py --preview --out _site --voice "$VOICE"

      - name: Upload a preview version
        if: steps.token.outputs.present == 'true'
        id: upload
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          # A token pasted with pbpaste can carry a trailing newline or spaces, which Cloudflare rejects as an invalid
          # Authorization header. Strip whitespace at both ends, then refuse anything that is not a token's shape (never printed).
          t="$CLOUDFLARE_API_TOKEN"; t="${t#"${t%%[![:space:]]*}"}"; t="${t%"${t##*[![:space:]]}"}"  # leading and trailing only
          CLOUDFLARE_API_TOKEN="$t"; export CLOUDFLARE_API_TOKEN
          if [[ ! "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]{20,}$ ]]; then
            echo "::error::The Cloudflare token secret is not a token (${#CLOUDFLARE_API_TOKEN} characters after trimming); save it again with gh secret set"
            exit 1
          fi
          npm ci --ignore-scripts
          set +e
          npx wrangler versions upload --config ../wrangler.jsonc --preview-alias "$ALIAS" 2>&1 | tee upload.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != 0 ]; then
            grep -qiE "not found|does not exist|no such worker|10007" upload.log && echo "::error::the Worker learnvedicmath does not exist yet: previews start after the first production deploy from main"
            exit "$code"
          fi
          url=$(grep -Eo "https://${ALIAS}-learnvedicmath\.[a-z0-9-]+\.workers\.dev" upload.log | head -1)
          test -n "$url" || { echo "::error::no preview URL in the wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post the preview URL
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf 'Preview of %s: %s\n\nNot indexed (X-Robots-Tag: noindex). The same URL updates with every push to this pull request.\n\n---\n_Posted by the preview workflow_' "$SHA" "$URL")
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" 2>/dev/null || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: The preview is not indexed
        if: steps.token.outputs.present == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          # Cloudflare answers *.workers.dev preview URLs with its own X-Robots-Tag: noindex, which replaces the
          # "noindex, nofollow" from _headers; noindex alone keeps the preview out of search results
          # Require an unscoped noindex: "googlebot: noindex" binds one crawler only and does not count
          curl -fsSI "$URL/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-robots-tag" { n=split($0, d, /, */); sub(/^[^:]*: */, "", d[1]); for (i=1; i<=n; i++) if (tolower(d[i])=="noindex") ok=1 } END { exit !ok }' \
            || { echo "::error::the preview does not send an unscoped X-Robots-Tag: noindex"; exit 1; }

      - name: Install Playwright
        if: steps.token.outputs.present == 'true'
        working-directory: e2e
        run: |
          # pnpm workspaces (openspec change react-typescript, task 1.1): corepack runs the pnpm version package.json pins
          corepack enable
          pnpm install --frozen-lockfile --filter e2e
          pnpm exec playwright install --with-deps chromium

      - name: Playwright tests against the preview (chromium)
        if: steps.token.outputs.present == 'true'
        working-directory: e2e
        env:
          BASE_URL: ${{ steps.upload.outputs.url }}
          E2E_SKIP_COV: "1"
        run: pnpm exec playwright test --project=chromium --grep-invert "@live-videos|@frame-cost"

      # The background's frame cost (tests/background-perf.spec.ts, @frame-cost) is measured with nothing else running:
      # with three workers on a four-core runner the other browsers preempt the timed frame, and its p95 read 3.6 to
      # 6.6 ms for a drawing that costs about 1 ms there (docs/agent/e2e.md). Its own output folders keep the suite's
      # traces and report in the artifact. Runs after the suite whether the suite passed or not.
      - name: Frame cost of the background, alone on the runner (chromium)
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        working-directory: e2e
        env:
          BASE_URL: ${{ steps.upload.outputs.url }}
          E2E_SKIP_COV: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/frame-cost
        run: pnpm exec playwright test --project=chromium --grep @frame-cost --workers=1 --output test-results/frame-cost

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-preview
          path: e2e/playwright-report
          retention-days: 14

  # The load and interaction gate (openspec change react-typescript, performance-budget spec, task 1.8): the pages of
  # tools/lighthouserc.json through Lighthouse's mobile preset and e2e/perf/interactions.ts (chromium, 4x CPU), each
  # median compared with docs/perf/baseline.json by tools/perf-compare.ts, which fails beyond the tolerances. The table
  # is posted on the pull request (one comment, updated on each push). The first-load byte gate is in build.py.
  perf:
    needs: preview
    # Runs whenever a preview was uploaded, even when a Playwright test failed: the two checks report on their own
    if: always() && needs.preview.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_URL: ${{ needs.preview.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the e2e package and chromium
        working-directory: e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter e2e
          pnpm exec playwright install --with-deps chromium

      - name: Lighthouse (mobile preset, 5 runs a page)
        working-directory: e2e
        run: node perf/lighthouse.mts "$BASE_URL" --json perf/results/lighthouse.json

      - name: Interaction timings (4x CPU, 5 runs)
        working-directory: e2e
        env:
          E2E_SKIP_COV: "1"
        run: pnpm exec playwright test -c perf/playwright.config.ts

      # A runner's load can move a Lighthouse median by a few hundred ms (docs/perf/baseline.md), more than the 100 ms
      # tolerance, so a miss is measured once more and only a miss in both runs fails the pull request
      - name: Compare with the baseline
        id: compare
        run: |
          set +e
          node tools/perf-compare.ts docs/perf/baseline.json e2e/perf/results/lighthouse.json e2e/perf/results/interactions.json --out perf-table.md
          code=$?
          if [ "$code" != 0 ]; then
            echo "::warning::a median missed its tolerance; measuring again to confirm"
            mkdir -p e2e/perf/first && cp e2e/perf/results/*.json e2e/perf/first/
            (cd e2e && node perf/lighthouse.mts "$BASE_URL" --json perf/results/lighthouse.json && pnpm exec playwright test -c perf/playwright.config.ts)
            node tools/perf-compare.ts docs/perf/baseline.json e2e/perf/results/lighthouse.json e2e/perf/results/interactions.json --out perf-table.md
            code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat perf-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the table on the pull request
        if: always() && steps.compare.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- perf-table -->'
          body=$(printf '%s\nPerformance of %s against docs/perf/baseline.json (median of 5 runs, the preview on workers.dev):\n\n%s\n\n---\n_Posted by the preview workflow (perf job)_' "$marker" "$SHA" "$(cat perf-table.md)")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"; fi

      - name: Fail beyond the tolerances
        if: steps.compare.outputs.code != '0'
        run: |
          echo "::error::a load or interaction median is beyond its tolerance (see the table above)"
          exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-preview
          path: e2e/perf/results
          retention-days: 14
