# gitleaks (ci.yml, job scan; openspec change learnvedicmath, design D12): the default rules, less two values that
# are public by design and sent to every browser that opens the site. Each exception names its rules, one file and
# the shape of that one value (condition AND), so any other secret in those files is still found.
[extend]
useDefault = true

# The Firebase web config's apiKey is public: what a browser may do is decided by cloud/firestore.rules, App Check
# and the key's referrer list, never by keeping the key secret (docs/agent/leaderboards.md). Only the apiKey line of
# js/cloud-config.js, for the Google API key and generic API key rules.
[[allowlists]]
description = "Firebase web config apiKey, public by design"
targetRules = ["gcp-api-key", "generic-api-key"]
condition = "AND"
paths = ['''^js/cloud-config\.js$''']
regexTarget = "line"
regexes = ['''^\s*apiKey:\s*["']AIza[0-9A-Za-z_-]{35}["'],?\s*$''']

# The Cloudflare Web Analytics site token is sent by every page's beacon. Only its one line in js/analytics.js, to
# the end of the line: after the token only a comment with no quote or = may follow, so a second key on that line is
# still found.
[[allowlists]]
description = "Cloudflare Web Analytics site token, public by design"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^js/analytics\.js$''']
regexTarget = "line"
regexes = ['''^\s*const CF_TOKEN = '[0-9a-f]{32}';\s*(//[^'"`=]*)?$''']

# A Claude model ID (claude-haiku-4-5-20251001) in a plan or doc reads as a generic API key: its date suffix has the
# entropy of one. Only the generic rule, and only when the matched secret is exactly a model ID, so a real key on the
# same line is still found. An Anthropic key starts sk-ant- and is caught by its own rule.
[[allowlists]]
description = "Claude model IDs, public names"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^claude-(haiku|sonnet|opus|fable)-[0-9]+(-[0-9]+)?(-[0-9]{8})?$''']
