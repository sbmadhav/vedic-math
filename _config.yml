# Repo-only files: the single list read by build.py --out (the CI deploy, see .github/workflows/ci.yml)
# and by Jekyll if Pages ever deploys the main branch directly. One "- item" per line. Paths starting
# with . or _ are always left out. Published at https://sbmadhav.com/vedic-math/.
exclude:
  - CLAUDE.md
  - README.md
  - GLOSSARY.md
  - CONTRIBUTING.md
  - SECURITY.md
  - LICENSE
  - LICENSE-CONTENT.md
  - build.py
  - cloud/
  - test/
  - docs/
  - e2e/
  - node_modules/
