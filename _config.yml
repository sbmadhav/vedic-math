# Repo-only files: the single list read by build.py (the CI deploy, see .github/workflows/ci.yml). One "- item" per
# line. Paths starting with . or _ are always left out. Published at https://learnvedicmath.com/ (Cloudflare Workers
# static assets, wrangler.jsonc). site/ holds page sources the build renders into their places; the design system is
# published from vendor/design-system/ at /ds/.
exclude:
  - CLAUDE.md
  - README.md
  - GLOSSARY.md
  - CONTRIBUTING.md
  - SECURITY.md
  - LICENSE
  - LICENSE-CONTENT.md
  - THIRD-PARTY-NOTICES.md
  - build.py
  - wrangler.jsonc
  - workers/
  - app/
  - shared/
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig.base.json
  - vitest.config.ts
  - deploy/
  - site/
  - moved/
  - theme/header.html
  - vendor/design-system/
  - vendor/**/SHA256SUMS
  - cloud/
  - test/
  - docs/
  - openspec/
  - brand/
  - tools/
  - e2e/
  - node_modules/
