schema: spec-driven

context: |
  Learn Vedic Math: a mental math game for ages 4 to adult, served at https://learnvedicmath.com/ from Cloudflare Workers static assets (wrangler.jsonc; CI deploys main and gives every pull request a preview; ADR 0004). No URL starts with /vedic-math/: the game is /play/, the Landing page and the grown-up pages are static, and build.py writes _headers (a Content-Security-Policy per page, HSTS, COOP; no policy meta) and _redirects. The Worker (workers/src/) runs only for /_csp, the policy-violation report endpoint, and keeps nothing personal. The old address sbmadhav.com/vedic-math/ hands progress over on the device, in three phases (Moved page, /import/, Export page; ADR 0005; change learnvedicmath). Many players are children.
  Nothing loads from another site before a Player acts: the design system (vendor/design-system/, published at /ds/), the fonts, the Firebase SDK (vendor/firebase/<version>/) and GoatCounter's count.js are served from this origin and pinned with checksums; THIRD_PARTIES in build.py is the one list of outside hosts a page may reach, and the build fails on any other. Google is reached only when a Player plays a video, or opens or posts to a World board.
  Use the terms in GLOSSARY.md exactly (Player, Mode, League, Age answer, Rating, Ranked round, Practice, Score, Sparks, Title, Medal, Board, World board, Device board, Hand-off, Moved page, Export page, Landing page; the Parent step is retired). Respect the decisions in docs/adr/. The product plan is docs/PLAN.md.
  Privacy is a hard constraint: nothing typed by a player is ever stored or sent; Nicknames are generated; the Age answer stays on the device and decides alone: a Player under 13 uses Device boards only and posts nothing, in every Mode (ADR 0006), and a Player 13 or over sees a World board after a tap and posts under an anonymous identity created at the first post (ADR 0002); World board entries expire after 30 days; parentNote() in js/app.js and cloud/README.md must always describe exactly what is sent and kept. Analytics are cookieless with no user IDs: GoatCounter (site code learnvedicmath, js/analytics.js, window.siteTrack) and Cloudflare Web Analytics; never Google Analytics (learnvedicmath design D11).
  Stack (react-typescript change, ADRs 0012 to 0014): React 19 with React Router v7 in framework mode, server-rendered on Cloudflare Workers; TypeScript (strict) in pnpm workspaces (app, workers, shared, e2e, tools). The migration is step by step: until a view moves, it is a Legacy view in plain ES modules under js/ (no framework there, no bundler for it until phase 2), mounted by the router; a view a migration pull request is moving is a Locked view. Firebase loads lazily from this site's vendor/ copy only when needed. Firestore rules live in cloud/firestore.rules and change together with their emulator tests in cloud/test/.
  Every behavior change ships with tests in the same change: unit tests (test/, and next to each TypeScript module; Vitest, `pnpm test`, from react-typescript task 1.6) and Playwright specs in e2e/. E2E tests run against each pull request's preview, and against the live site after a deploy, daily and on demand; they must never write to production Firestore or count analytics visits.
  Copy rules: no em dashes; wording for every Mode (Explorer, Challenger, Pro) via fx.t(); honest framing of the sutras (from Bharati Krishna Tirtha's 1965 book, never "from the Vedas").
  Security contact: security@learnvedicmath.com (SECURITY.md and /.well-known/security.txt).

rules:
  proposal:
    - State what is out of scope.
    - Name the Modes and Players affected.
  tasks:
    - Include the test tasks (node, rules emulator, Playwright) next to the code tasks they cover.
    - Include updating parentNote() and cloud/README.md whenever what is sent or kept changes.
