schema: spec-driven

context: |
  Vedic Math for Everyone: a mental math game for ages 4 to adult, served at https://sbmadhav.com/vedic-math/ from this repo by GitHub Pages. Many players are children.
  Use the terms in GLOSSARY.md exactly (Player, Mode, League, Age answer, Parent step, Rating, Ranked round, Practice, Score, XP, Board, World board, Device board). Respect the decisions in docs/adr/. The product plan is docs/PLAN.md.
  Privacy is a hard constraint: nothing typed by a player is ever stored or sent; Nicknames are generated; under-13 Players post nothing to World boards without the Parent step; no anonymous identity exists until the first post; parentNote() in js/app.js and cloud/README.md must always describe exactly what is sent and kept.
  Plain vanilla ES modules, no framework, no bundler. Firebase loads lazily from the CDN only when needed. Firestore rules live in cloud/firestore.rules and change together with their emulator tests in cloud/test/.
  Every behavior change ships with tests in the same change: node tests in test/ and Playwright specs in e2e/. E2E tests run against the live site and must never write to production Firestore or count analytics visits.
  Copy rules: no em dashes; wording for every Mode (Explorer, Challenger, Pro) via fx.t(); honest framing of the sutras (from Bharati Krishna Tirtha's 1965 book, never "from the Vedas").

rules:
  proposal:
    - State what is out of scope.
    - Name the Modes and Players affected.
  tasks:
    - Include the test tasks (node, rules emulator, Playwright) next to the code tasks they cover.
    - Include updating parentNote() and cloud/README.md whenever what is sent or kept changes.
